{% extends 'base.html' %}
{% block content %}

<div style="height: calc(100vh - 140px); display:flex; justify-content:center; align-items:center;">
    <div class="content-card" style="max-width:400px; width:100%; text-align:center; padding:40px;">
        <div style="font-size:48px; color:#f59e0b; margin-bottom:16px;"><i class="fas fa-exclamation-triangle"></i></div>
        <h2 style="font-weight:700; margin-bottom:8px; font-size:22px;">Terminate Active Profile Session?</h2>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Confirming below will drop your current runtime tokens. You will need to re-verify credentials.</p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <a href="{{ url_for('dashboard') }}" class="btn-primary" style="background-color:var(--border-color); color:var(--text-dark);"><i class="fas fa-arrow-left"></i> Abort</a>
            <a href="{{ url_for('logout_confirm') }}" class="btn-primary" style="background-color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Kill Session</a>
        </div>
    </div>
</div>

{% endblock %}
