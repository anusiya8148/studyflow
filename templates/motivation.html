{% extends 'base.html' %}
{% block content %}

<div style="margin-bottom:32px;">
    <h1 style="font-size:26px; font-weight:700;">Motivation Portal Node</h1>
    <p style="color:var(--text-muted); font-size:14px;">Reset your focus parameters using compiled target perspective statements.</p>
</div>

<div class="glass-widget" style="margin: 40px auto; max-width: 700px;">
    <div style="font-size:42px; color:var(--primary-purple); margin-bottom:20px;"><i class="fas fa-quote-left"></i></div>
    <h2 id="motivationalDisplayQuote" style="font-weight:600; font-size:24px; line-height:1.6; transition: opacity 0.2s ease-in-out; min-height: 80px;">
        "{{ quote }}"
    </h2>
    <hr style="border:none; border-top:1px solid var(--border-color); margin:24px 0;">
    <button class="btn-primary" onclick="rotateInspirationalQuote()"><i class="fas fa-redo"></i> Request Alternative Frame Vector</button>
</div>

<div style="max-width:700px; margin: 0 auto;">
    <h3 style="font-size:16px; font-weight:600; margin-bottom:14px; color:var(--text-muted);">Compiled Statement Matrices Index</h3>
    <ul style="list-style:none; display:flex; flex-direction:column; gap:10px;">
        {% for q in all_quotes %}
        <li style="padding:14px; background-color:var(--card-bg); border-radius:8px; border:1px solid var(--border-color); font-size:14px; color:var(--text-dark); font-style:italic;">
            "{{ q }}"
        </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
