<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Account Access Authorization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-wrapper">

    <div class="toast-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="toast-alert toast-{{ category }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <h2>StudyFlow</h2>
            <p>Welcome back! Secure access verification layer.</p>
        </div>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>System Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="user@domain.com" required>
            </div>
            <div class="form-group">
                <label>Security Access Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Authorize & Connect</button>
        </form>
        <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            New user? <a href="{{ url_for('register') }}" style="color: var(--primary-purple); text-decoration: none; font-weight: 600;">Create cloud profile</a>
        </p>
    </div>

</body>
</html>
